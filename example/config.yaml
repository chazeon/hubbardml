# Fixed user config - converted from broken JSON+comments to proper YAML
# Original had JSON syntax with comments which is invalid

# Graph configuration  
graph:
  species: ["Fe"]  # Will be dynamically updated
  with_param_in: false

# Model configuration
model:
  feature_irreps: "4x0e + 4x1e + 4x2e + 4x3e"
  hidden_layers: 2
  irrep_normalization: "component"

# Training configuration
training:
  learning_rate: 0.001
  batch_size: 64
  max_epochs: 10000
  val_split: 0.2             # Validation split (20%)
  patience: 400              # Early stopping patience
  checkpoint_dir: "checkpoints_pytorch_nodf"
  checkpoint_freq: 500
  log_every_n_epochs: 50     # Print every 50 epochs
  target_param: "param_out"  # Fixed: was keys.PARAM_OUT without import
  final_model_path: "trained_model_pytorch_nodf.pth"
  final_config_path: "config.json"

# Data configuration
data:
  arrow_files: ["data/dataset.arrow"]  # Updated path to data directory
  
  # Define columns needed for the model and target (re-enabled)
  required_feature_cols:
    - "atom_1_element"      # Fixed: direct strings instead of keys.* constants
    - "atom_1_occs_1"
    - "atom_1_occs_2"
    - "atom_2_element"      # Needed for determining species
    # Add atom_2_occs_* if your model uses pair features
    
  # Explicitly define target column (re-enabled)
  target_col: "param_out"   # Fixed: direct string instead of keys.PARAM_OUT